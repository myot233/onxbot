name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: onxbot
          POSTGRES_PASSWORD: onxbot_test
          POSTGRES_DB: onxbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onxbot -d onxbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://onxbot:onxbot_test@127.0.0.1:5432/onxbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: onxbot-ghcr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" .
          docker push "$image:sha-$GITHUB_SHA"
          read -r main_sha _ < <(git ls-remote origin refs/heads/main)
          if [[ "$GITHUB_SHA" == "$main_sha" ]]; then
            docker tag "$image:sha-$GITHUB_SHA" "$image:main"
            docker push "$image:main"
          fi
